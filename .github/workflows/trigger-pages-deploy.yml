name: Trigger Pages Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  trigger:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch korphos.github.io deploy workflow
        env:
          GH_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          curl -sSf -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/korphos/korphos.github.io/actions/workflows/deploy.yml/dispatches \
            -d '{"ref":"main"}'
